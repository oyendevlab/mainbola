<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded square with emerald stroke -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#080D1A" stroke="url(#emeraldBorder)" stroke-width="6" />

  <!-- Pixel Soccer Ball -->
  <g transform="translate(64, 64)">
    <!-- Ball Base White Circle -->
    <circle cx="0" cy="0" r="38" fill="#FFFFFF" stroke="#020617" stroke-width="4" />
    
    <!-- Ball Shading on lower-right -->
    <path d="M 0,38 A 38,38 0 0,0 38,0 A 38,38 0 0,1 0,38 Z" fill="#CBD5E1" />

    <!-- Center Pentagon (Pixel Style) -->
    <polygon points="0,-16 16,-4 10,16 -10,16 -16,-4" fill="#0F172A" />

    <!-- Seams connecting to perimeter -->
    <line x1="0" y1="-16" x2="0" y2="-36" stroke="#0F172A" stroke-width="4" stroke-linecap="square" />
    <line x1="16" y1="-4" x2="34" y2="-12" stroke="#0F172A" stroke-width="4" stroke-linecap="square" />
    <line x1="10" y1="16" x2="24" y2="30" stroke="#0F172A" stroke-width="4" stroke-linecap="square" />
    <line x1="-10" y1="16" x2="-24" y2="30" stroke="#0F172A" stroke-width="4" stroke-linecap="square" />
    <line x1="-16" y1="-4" x2="-34" y2="-12" stroke="#0F172A" stroke-width="4" stroke-linecap="square" />

    <!-- Outer Pentagons (Perimeter cutoffs) -->
    <!-- Top -->
    <polygon points="-12,-37 12,-37 8,-28 -8,-28" fill="#0F172A" />
    <!-- Top Right -->
    <polygon points="34,-14 37,-3 26,6 23,-3" fill="#0F172A" />
    <!-- Bottom Right -->
    <polygon points="22,30 31,21 34,26 18,36" fill="#0F172A" />
    <!-- Bottom Left -->
    <polygon points="-22,30 -31,21 -34,26 -18,36" fill="#0F172A" />
    <!-- Top Left -->
    <polygon points="-34,-14 -37,-3 -26,6 -23,-3" fill="#0F172A" />

    <!-- Pixel Gleam -->
    <rect x="-18" y="-22" width="6" height="6" fill="#FFFFFF" />
  </g>

  <!-- Kinetic Emerald Energy Pixel Sparks -->
  <rect x="96" y="20" width="8" height="8" rx="2" fill="#34D399" />
  <rect x="106" y="32" width="12" height="6" rx="2" fill="#10B981" />
  <rect x="88" y="14" width="6" height="4" rx="1" fill="#FDE047" />
</svg>
