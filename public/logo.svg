<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Emblem on left (80x80 box, centered at x=50, y=50) -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Card -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#080D1A" stroke="url(#logoEmerald)" stroke-width="3.5" />
    
    <!-- Inner Pixel Ball -->
    <g transform="translate(40, 40)">
      <!-- Ball Base White Circle -->
      <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#020617" stroke-width="2.5" />
      <path d="M 0,26 A 26,26 0 0,0 26,0 A 26,26 0 0,1 0,26 Z" fill="#CBD5E1" />

      <!-- Center Pentagon -->
      <polygon points="0,-11 11,-3 7,11 -7,11 -11,-3" fill="#0F172A" />

      <!-- Seams -->
      <line x1="0" y1="-11" x2="0" y2="-24" stroke="#0F172A" stroke-width="2.5" stroke-linecap="square" />
      <line x1="11" y1="-3" x2="23" y2="-8" stroke="#0F172A" stroke-width="2.5" stroke-linecap="square" />
      <line x1="7" y1="11" x2="16" y2="20" stroke="#0F172A" stroke-width="2.5" stroke-linecap="square" />
      <line x1="-7" y1="11" x2="-16" y2="20" stroke="#0F172A" stroke-width="2.5" stroke-linecap="square" />
      <line x1="-11" y1="-3" x2="-23" y2="-8" stroke="#0F172A" stroke-width="2.5" stroke-linecap="square" />

      <!-- Outer Pentagons -->
      <polygon points="-8,-25 8,-25 6,-19 -6,-19" fill="#0F172A" />
      <polygon points="23,-9 25,-2 18,4 16,-2" fill="#0F172A" />
      <polygon points="15,20 21,14 23,17 12,24" fill="#0F172A" />
      <polygon points="-15,20 -21,14 -23,17 -12,24" fill="#0F172A" />
      <polygon points="-23,-9 -25,-2 -18,4 -16,-2" fill="#0F172A" />

      <!-- Pixel Gleam -->
      <rect x="-12" y="-15" width="4" height="4" fill="#FFFFFF" />
    </g>

    <!-- Emerald Sparks -->
    <rect x="62" y="12" width="6" height="6" rx="1.5" fill="#34D399" />
    <rect x="70" y="22" width="8" height="4" rx="1" fill="#10B981" />
  </g>

  <!-- Typography on right -->
  <g transform="translate(108, 0)">
    <!-- Main Title -->
    <text x="0" y="52" fill="url(#textGrad)" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      MAIN<tspan fill="#10B981">BOLA</tspan>
    </text>

    <!-- Subtitle Badge / Tagline -->
    <rect x="0" y="62" width="180" height="20" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="90" y="76" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      FOOTBALL MANAGER LITE
    </text>
  </g>
</svg>
