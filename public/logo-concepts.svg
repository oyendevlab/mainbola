<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background:#080D1A; font-family:'Inter',sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="40" fill="#F8FAFC" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2">
    CADANGAN KONSEP LOGO MAINBOLA (v0.2.1)
  </text>
  <text x="450" y="65" fill="#94A3B8" font-size="12" text-anchor="middle">
    Pilih salah satu konsep di bawah untuk dijadikan logo rasmi &amp; ikon aplikasi PWA
  </text>

  <!-- ================= OPTION 1 ================= -->
  <g transform="translate(60, 95)">
    <!-- Card Background -->
    <rect width="230" height="200" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <!-- Tag -->
    <rect x="15" y="15" width="80" height="18" rx="9" fill="#10B981" fill-opacity="0.15" />
    <text x="55" y="27" fill="#34D399" font-size="9" font-weight="700" text-anchor="middle">PILIHAN 1</text>
    
    <!-- Icon Container -->
    <g transform="translate(115, 95)">
      <!-- Shield / Hexagon -->
      <polygon points="0,-48 42,-22 42,24 0,50 -42,24 -42,-22" fill="#080D1A" stroke="url(#emeraldGrad)" stroke-width="4" />
      <!-- Inner ball -->
      <circle cx="0" cy="8" r="24" fill="#FFFFFF" />
      <!-- Pixel pentagons on ball -->
      <rect x="-6" y="2" width="12" height="12" fill="#0F172A" />
      <rect x="-18" y="8" width="6" height="6" fill="#0F172A" />
      <rect x="12" y="8" width="6" height="6" fill="#0F172A" />
      <rect x="-6" y="-12" width="12" height="6" fill="#0F172A" />
      <!-- Golden Pixel Crown on top -->
      <polygon points="-16,-24 -20,-38 -8,-30 0,-42 8,-30 20,-38 16,-24" fill="url(#goldGrad)" />
      <circle cx="0" cy="-42" r="2" fill="#FFF" />
      <circle cx="-20" cy="-38" r="2" fill="#FFF" />
      <circle cx="20" cy="-38" r="2" fill="#FFF" />
    </g>

    <text x="115" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Pixel Crown</text>
    <text x="115" y="182" fill="#94A3B8" font-size="10" text-anchor="middle">Retro Arcade &amp; Mahkota Juara</text>
  </g>

  <!-- ================= OPTION 2 ================= -->
  <g transform="translate(335, 95)">
    <!-- Card Background -->
    <rect width="230" height="200" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <!-- Tag -->
    <rect x="15" y="15" width="105" height="18" rx="9" fill="#10B981" fill-opacity="0.2" />
    <text x="67" y="27" fill="#34D399" font-size="9" font-weight="700" text-anchor="middle">PILIHAN 2 (Cadangan)</text>
    
    <!-- Icon Container -->
    <g transform="translate(115, 95)">
      <!-- Outer rounded square with glow -->
      <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#080D1A" stroke="url(#cyanGrad)" stroke-width="3" />
      <!-- Pixel "M" Letterform -->
      <path d="M-26,22 L-26,-18 L-14,-18 L-4,2 L6,-18 L18,-18 L18,22 L8,22 L8,-2 L0,12 L-8,-2 L-8,22 Z" fill="url(#emeraldGrad)" />
      <!-- Kinetic Pixel Soccer Ball launched from M -->
      <circle cx="24" cy="-22" r="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
      <rect x="22" y="-24" width="4" height="4" fill="#0F172A" />
      <!-- Speed sparks -->
      <rect x="8" y="-30" width="6" height="3" fill="#38BDF8" rx="1.5" />
      <rect x="16" y="-35" width="4" height="2" fill="#FDE047" rx="1" />
      <rect x="36" y="-12" width="5" height="2" fill="#34D399" rx="1" />
    </g>

    <text x="115" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Dynamic Pixel 'M'</text>
    <text x="115" y="182" fill="#94A3B8" font-size="10" text-anchor="middle">Monogram M &amp; Bola Kilat</text>
  </g>

  <!-- ================= OPTION 3 ================= -->
  <g transform="translate(610, 95)">
    <!-- Card Background -->
    <rect width="230" height="200" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <!-- Tag -->
    <rect x="15" y="15" width="80" height="18" rx="9" fill="#3B82F6" fill-opacity="0.15" />
    <text x="55" y="27" fill="#60A5FA" font-size="9" font-weight="700" text-anchor="middle">PILIHAN 3</text>
    
    <!-- Icon Container -->
    <g transform="translate(115, 95)">
      <!-- Circle Compass / Manager Crest -->
      <circle cx="0" cy="0" r="44" fill="#080D1A" stroke="#10B981" stroke-width="3" stroke-dasharray="6 3" />
      <!-- Pitch turf circle -->
      <circle cx="0" cy="0" r="36" fill="#16512B" />
      <!-- Pitch Halfway Line -->
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
      <!-- Central Soccer Ball -->
      <circle cx="0" cy="0" r="13" fill="#FFFFFF" />
      <polygon points="0,-5 5,-1 3,5 -3,5 -5,-1" fill="#0F172A" />
      <!-- Tactical Pins (X and O) -->
      <text x="-20" y="-14" fill="#FDE047" font-size="9" font-weight="900" text-anchor="middle">✕</text>
      <text x="20" y="22" fill="#38BDF8" font-size="9" font-weight="900" text-anchor="middle">○</text>
      <text x="18" y="-16" fill="#FDE047" font-size="8" font-weight="900" text-anchor="middle">✕</text>
    </g>

    <text x="115" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Tactical Pitch Crest</text>
    <text x="115" y="182" fill="#94A3B8" font-size="10" text-anchor="middle">Kompas Padang &amp; Taktikal FM</text>
  </g>
</svg>
